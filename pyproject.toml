[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tactivision"
version = "0.1.0"
description = "Football broadcast analysis (vision engine + future API/front-end scaffolding)"
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "ultralytics>=8.0.0",
    "lap>=0.5.12",
    "scikit-learn>=1.3.0",
    "roboflow>=1.1.0",
    "inference-sdk>=0.9.7",
]

[project.scripts]
tactivision = "main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["VisionEngine*"]
